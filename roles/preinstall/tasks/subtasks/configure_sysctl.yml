---
- name: "[preinstall] Apply sysctl parameters (persistent file and live kernel values)"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ sysctl_settings_file }}"
    sysctl_set: true
    reload: true
  loop: "{{ ece_sysctl_parameters }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[preinstall] Enable IPv6 forwarding for container IPv6 egress (ECE 4.2+)"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    sysctl_file: "{{ sysctl_settings_file }}"
    sysctl_set: true
    reload: true
  when:
    - ece_ipv6_egress | bool
    - ece_version is version('4.2.0', '>=')

- name: "[preinstall] Restart NetworkManager to apply network sysctl settings"
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted
  when: ansible_os_family == "RedHat"
  ignore_errors: true
