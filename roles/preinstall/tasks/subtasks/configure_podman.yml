---
- name: "[preinstall] Lock Podman package versions with dnf_versionlock"
  community.general.dnf_versionlock:
    name: "{{ podman_version_map[podman_version]['package'] }}"
    state: present

- name: "[preinstall] Stop the podman service"
  ansible.builtin.systemd_service:
    name: podman
    state: stopped

- name: "[preinstall] Ensure /etc/systemd/system/podman.socket.d directory exists"
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    state: directory

- name: "[preinstall] Create podman.conf in service.d"
  ansible.builtin.template:
    src: podman.conf.j2
    dest: /etc/systemd/system/podman.socket.d/podman.conf
  register: podman_conf_created

- name: "[preinstall] Remove /var/lib/podman if podman.conf was changed"
  ansible.builtin.file:
    path: /var/lib/podman
    state: absent
    force: true
  when: podman_conf_created.changed

- name: "[preinstall] Create /usr/bin/docker with podman-remote command"
  ansible.builtin.copy:
    dest: /usr/bin/docker
    content: |
      #!/bin/bash
      podman-remote --url unix:///var/run/docker.sock "$@"
    mode: '0755'
    owner: root
    group: root

- name: "[preinstall] Check for vendor default container config files in /usr/share/containers"
  ansible.builtin.stat:
    path: "/usr/share/containers/{{ item }}"
  loop:
    - containers.conf
    - storage.conf
    - policy.json
  register: vendor_container_files

# Per the ECE 4.2 RHEL host docs, copy /usr/share/containers/containers.conf to
# /etc/containers/ when missing. RHEL/Rocky 10 also ships no
# /etc/containers/{storage.conf,policy.json} (defaults live in
# /usr/share/containers), so seed those too (never overwrite) to avoid a
# header-less storage.conf and a missing signature policy.
- name: "[preinstall] Seed /etc/containers from vendor defaults when missing"
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "/etc/containers/{{ item.item }}"
    remote_src: true
    force: false
    mode: '0644'
  loop: "{{ vendor_container_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

# Network backend per ECE docs: CNI on RHEL/Rocky 8 and 9 (set explicitly so the
# host does not depend on defaults), Netavark (default) on RHEL 10 where any
# leftover cni pin must be removed and containernetworking-plugins not installed.
- name: "[preinstall] RHEL/Rocky 8 and 9: set network_backend to cni"
  ansible.builtin.ini_file:
    path: /etc/containers/containers.conf
    section: network
    option: network_backend
    value: '"cni"'
    no_extra_spaces: true
  when: ansible_distribution_major_version in ['8', '9']

- name: "[preinstall] RHEL/Rocky 10: remove network_backend pin so Netavark is used"
  ansible.builtin.ini_file:
    path: /etc/containers/containers.conf
    section: network
    option: network_backend
    state: absent
    no_extra_spaces: true
  when: ansible_distribution_major_version == '10'

- name: "[preinstall] Configure container ulimits in containers.conf"
  ansible.builtin.ini_file:
    path: /etc/containers/containers.conf
    section: containers
    option: default_ulimits
    value: '["nofile=1024000:1024000", "memlock=-1:-1", "nproc=-1:-1"]'
    no_extra_spaces: true
    create: true

- name: "[preinstall] Ensure a minimal /etc/containers/policy.json exists as a last resort"
  ansible.builtin.copy:
    dest: /etc/containers/policy.json
    content: |
      {"default": [{"type": "insecureAcceptAnything"}]}
    force: false
    mode: '0644'

- name: "[preinstall] Ensure [storage] section header exists in /etc/containers/storage.conf"
  ansible.builtin.lineinfile:
    path: /etc/containers/storage.conf
    regexp: '^\[storage\]'
    line: '[storage]'
    insertbefore: BOF
    create: true

- name: "[preinstall] Update storage configuration in /etc/containers/storage.conf"
  ansible.builtin.lineinfile:
    path: /etc/containers/storage.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = \"{{ item.value }}\""
    insertafter: '^\[storage\]'
    state: present
    create: true
  loop:
    - { key: 'driver', value: 'overlay' }
    - { key: 'runroot', value: '/mnt/data/docker/runroot/' }
    - { key: 'graphroot', value: '/mnt/data/docker' }

- name: "[preinstall] Check whether the ece-network Podman network exists"
  ansible.builtin.command: podman network inspect ece-network
  register: ece_network_check
  changed_when: false
  failed_when: false
  when:
    - ece_ipv6_egress | bool
    - ece_version is version('4.2.0', '>=')

# ECE 4.2+: Podman cannot configure IPv4+IPv6 on the built-in default network via
# containers.conf, so create a dual-stack network and make it the default.
- name: "[preinstall] Create dual-stack Podman network ece-network"
  ansible.builtin.command: >
    podman network create --subnet {{ ece_ipv6_subnet_v4 }}
    --subnet {{ ece_ipv6_subnet_v6 }} --ipv6 ece-network
  when:
    - ece_network_check is not skipped
    - ece_network_check.rc != 0

- name: "[preinstall] Set ece-network as the default Podman network"
  ansible.builtin.ini_file:
    path: /etc/containers/containers.conf
    section: network
    option: default_network
    value: '"ece-network"'
    no_extra_spaces: true
  when:
    - ece_ipv6_egress | bool
    - ece_version is version('4.2.0', '>=')

- name: "[preinstall] Append overlay to /etc/modules-load.d/overlay.conf"
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/overlay.conf
    line: "overlay"
    create: true

- name: "[preinstall] Ensure Podman services and socket are enabled and started"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - podman
    - podman-restart.service
    - podman.socket
